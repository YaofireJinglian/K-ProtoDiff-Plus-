model:
  target: Models.KPD.k_diffusion.Model
  params:
    seq_length: 24
    feature_size: 5
    n_layer_enc: 1
    n_layer_dec: 2
    d_model: 64
    timesteps: 500
    sampling_timesteps: 500
    loss_type: l1
    beta_schedule: cosine
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 1
    padding_size: 0
    fdm_mode: real

    # Journal extension: hierarchical multi-scale temporal prototypes.
    prototype_mode: multiscale
    num_prototypes: 8
    prototype_scales: [4, 8, 16]
    prototype_stride_ratio: 0.5
    prototype_temperature: 0.1
    prototype_loss_weight: 0.05
    prototype_balance_weight: 0.1
    prototype_diversity_weight: 0.1
    prototype_consistency_weight: 0.1

    # Journal extension: one-call adaptive reflection sampling.
    sampling_mode: adaptive_reflection
    adaptive_sampling_timesteps: 50
    reflection_strength: 0.1
    reflection_threshold: 0.15
    reflection_temperature: 0.05
    reflection_roughness_threshold: 1.25
    reflection_roughness_temperature: 0.15
    reflection_start_ratio: 0.5
    reflection_topk_ratio: 0.25
    reflection_mask_temperature: 0.1
    adaptive_stride_gain: 1.0

solver:
  base_lr: 1.0e-5
  max_epochs: 12000
  results_folder: ./checkpoints/journal/Checkpoints_sine_journal
  gradient_accumulate_every: 2
  save_cycle: 1200
  ema:
    decay: 0.995
    update_interval: 10

  scheduler:
    target: Layer.engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 3000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500
      verbose: False

dataloader:
  train_dataset:
    target: Utils.Data_utils.sine_dataset.SineDataset
    params:
      num: 10000
      dim: 5
      window: 24
      save2npy: true
      neg_one_to_one: true
      seed: 123
      period: train

  test_dataset:
    target: Utils.Data_utils.sine_dataset.SineDataset
    params:
      num: 1000
      dim: 5
      window: 24
      save2npy: true
      neg_one_to_one: true
      seed: 123
      style: separate
      period: test
      distribution: geometric
    coefficient: 1.0e-2
    step_size: 5.0e-2
    sampling_steps: 50

  batch_size: 128
  sample_size: 256
  shuffle: true
