dataset: eeg
base_config: Config/journal/eeg.yaml
screen_seed: 2026
screen_steps: 6000
validation_samples: 1024
training_trials:
- name: control
  overrides: {}
  warm_start_from: /data/dyh_data/0806/K-ProtoDiff/checkpoints/journal_search/eeg/control/latest.pt
- name: incumbent
  overrides:
    solver.scheduler.params.warmup_lr: 0.0003
  warm_start_from: /data/dyh_data/0806/K-ProtoDiff/checkpoints/journal_search/eeg/lower_lr/latest.pt
- name: refined
  overrides:
    solver.scheduler.params.warmup_lr: 0.0003
    model.params.prototype_loss_weight: 0.01
samplers:
- name: original50
  params:
    adaptive_sampling_timesteps: 50
    reflection_strength: 0.1
- name: incumbent_sampling
  params:
    adaptive_sampling_timesteps: 200
    reflection_strength: 0.02
- name: refined_sampling
  params:
    adaptive_sampling_timesteps: 300
    reflection_strength: 0.01
namespace: journal_search_round2
