dataset: exchange
base_config: Config/journal/exchange.yaml
screen_seed: 2026
screen_steps: 3000
validation_samples: 1024
training_trials:
  - name: control
    overrides: {}
  - name: lower_lr
    overrides:
      solver.scheduler.params.warmup_lr: 0.0003
  - name: lower_prototype_weight
    overrides:
      model.params.prototype_loss_weight: 0.01
samplers:
  - name: original50
    params:
      adaptive_sampling_timesteps: 50
      reflection_strength: 0.1
  - name: gentle100
    params:
      adaptive_sampling_timesteps: 100
      reflection_strength: 0.05
  - name: gentle200
    params:
      adaptive_sampling_timesteps: 200
      reflection_strength: 0.02
